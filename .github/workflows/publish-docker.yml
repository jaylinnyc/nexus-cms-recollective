name: Build and Publish Docker Images

# Trigger on push to production branch only
on:
  push:
    branches:
      - production

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      strapi: ${{ steps.filter.outputs.strapi }}
      image-resizer: ${{ steps.filter.outputs.image-resizer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            strapi:
              - 'strapi/**'
            image-resizer:
              - 'image-resizer/**'

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Private Docker Registry
        uses: docker/login-action@v2
        with:
          registry: docker.goodgermy.com
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.goodgermy.com/nexus/recollective-frontend:latest

  build-image-resizer:
    name: Build & Push Image Resizer
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.image-resizer == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Private Docker Registry
        uses: docker/login-action@v2
        with:
          registry: docker.goodgermy.com
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push image-resizer image
        uses: docker/build-push-action@v4
        with:
          context: ./image-resizer
          file: ./image-resizer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.goodgermy.com/nexus/recollective-image-resizer:latest

  build-strapi:
    name: Build & Push Strapi
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.strapi == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Private Docker Registry
        uses: docker/login-action@v2
        with:
          registry: docker.goodgermy.com
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push strapi image
        uses: docker/build-push-action@v4
        with:
          context: ./strapi
          file: ./strapi/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.goodgermy.com/nexus/recollective/strapi:latest